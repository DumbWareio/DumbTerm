name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node.js 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Builds the same Dockerfile the release workflow publishes, for amd64 only, without pushing
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          tags: dumbterm:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

      - name: Show runtime versions
        run: docker run --rm --entrypoint node dumbterm:ci -p "process.version + ' (openssl ' + process.versions.openssl + ')'"

      # Runs the test suite inside the image, so node-pty, Node.js and the shell are the shipped ones
      - name: Run tests inside the image
        run: docker run --rm -v "$PWD/test:/app/test:ro" --entrypoint npm dumbterm:ci test
